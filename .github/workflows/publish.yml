# Publish limTOD to PyPI via Trusted Publishing (OIDC) — no API token needed.
#
# One-time PyPI setup (done on pypi.org, not here):
#   Account settings -> Publishing -> "Add a new pending publisher":
#     PyPI project name : limTOD
#     Owner             : zzhang0123
#     Repository        : limTOD
#     Workflow name     : publish.yml
#     Environment name  : pypi
# The first successful run creates the PyPI project and claims the name.
#
# Trigger: publishing a GitHub Release (or manual dispatch as a fallback).
# No untrusted event data is interpolated into any run command.
#
# The build job refuses to proceed unless the version in pyproject.toml is
# releasable: a release must be tagged v<version>, and the version must not
# already exist on PyPI. Both failures used to surface only as an opaque
# "400 File already exists" from the upload at the very end of the run.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version is releasable
        env:
          # Event data reaches the script as environment variables, never
          # interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "pyproject.toml version: $VERSION"

          # A release must be tagged v<version>. Catches a tag placed on a commit
          # whose version bump never landed: v1.5.3 rebuilt 1.5.2 and PyPI
          # rejected it with an opaque 400 at the very last step, after the tag
          # and the release had already been created.
          if [ "$EVENT_NAME" = "release" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION' — expected tag 'v$VERSION'. Bump the version or move the tag."
            exit 1
          fi

          # PyPI never allows a filename to be reused, so a version that is
          # already published can only be a missed bump. This also covers
          # workflow_dispatch, which has no tag to check against. Anything other
          # than a definite 200 is treated as "not published" so that a PyPI
          # outage cannot block a release.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/limTOD/$VERSION/json" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "::error::limTOD $VERSION is already on PyPI. Bump the version in pyproject.toml."
            exit 1
          fi
          echo "Version $VERSION is releasable (PyPI lookup returned $STATUS)."
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
