[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limTOD"
version = "1.3.0"
authors = [
    {name = "Zheng Zhang", email = "zheng.zhang@manchester.ac.uk"},
]
description = "Time-Ordered Data Simulator for MeerKLASS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "time-ordered data",
    "simulation",
    "MeerKAT",
    "HEALPix",
    "beam patterns",
    "sky models",
    "noise modeling",
    "map making"
]
# Base dependencies are kept to wheel-installable packages only. Heavy or
# toolchain-dependent dependencies live in extras (see below): mpi4py needs a
# system MPI compiler ([mpi]); pygdsm pulls extra packages and downloads sky
# data ([gdsm]). Without them limTOD runs serially and every feature except
# GDSM_sky_model works unchanged.
dependencies = [
    "numpy>=1.19.0",
    "healpy>=1.14.0",
    "astropy>=4.0.0",
    "scipy>=1.5.0",
    "tqdm>=4.60.0",
    "mpmath>=1.2.0",
]

[project.optional-dependencies]
# MPI-parallel runs (mpirun/mpiexec); without it limTOD.mpiutil falls back to
# serial mode (rank=0, size=1).
mpi = [
    "mpi4py>=3.0.0",
]
# The Global Sky Model used by limTOD.sky_model.GDSM_sky_model (lazy import).
gdsm = [
    "pygdsm>=1.2.0",
]
# Everything (today's pre-1.3 default install). Deps are enumerated directly
# rather than as self-referential "limTOD[...]" extras because this package is
# installed from source/git — a self-reference would make pip resolve "limTOD"
# against PyPI, where it is not published.
full = [
    "mpi4py>=3.0.0",
    "pygdsm>=1.2.0",
    "jax>=0.5",
    "s2fft>=1.4.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "jupyter>=1.0",
    "matplotlib>=3.3.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "jupyter>=1.0",
    "matplotlib>=3.3.0",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
]
# The jax extra requires Python >= 3.11 (s2fft floor); the base package stays >= 3.8.
jax = [
    "jax>=0.5",
    "s2fft>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/zzhang0123/limTOD"
"Bug Reports" = "https://github.com/zzhang0123/limTOD/issues"
"Source Code" = "https://github.com/zzhang0123/limTOD"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["limTOD*", "limtod_jax*"]

[tool.setuptools.package-data]
limTOD = ["data/*", "examples/*"]